name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          docker run --rm -v "$PWD:/app:ro" php:8.3-cli sh -c 'set -e; find /app -name "*.php" -exec php -l {} \; >/dev/null; php /app/tests/appearance-contract.php; php /app/tests/host-domain-contract.php; php /app/tests/login-host-contract.php; php /app/tests/login-slides-contract.php'
      - name: Isolated Composer path-package discovery
        run: sh tests/composer-path-discovery.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and contract tests
        run: node --test tests/*.test.cjs
      - name: Browser regression (dark and light)
        run: |
          command -v google-chrome
          node tests/browser-regression.mjs
          node tests/browser-login-editor.mjs
